[pytest]
addopts = --import-mode=importlib -q
pythonpath = shared services/auth services/sit services/despachos services/rastreo mocks/dhl
testpaths = shared/tests services mocks tests
markers =
    redis: requiere un Redis real en REDIS_URL_PRUEBAS (por ejemplo: docker run --rm -p 6379:6379 redis:7-alpine)
    e2e: prueba de punta a punta; requiere docker compose en ejecución y E2E=1
filterwarnings =
    ignore::DeprecationWarning
